<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <title>Titleflix</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="no-motion">
    <header class="brand">
      <img class="brand-mark" src="icons/logo.svg" alt="" width="28" height="28" />
      <h1>Titleflix</h1>
      <span class="version" id="version"></span>
    </header>

    <!-- The status card is a small browser window: a tab strip on top, the page below. -->
    <section class="window" id="now" data-state="loading" aria-live="polite" aria-labelledby="statusLabel">
      <div class="strip" aria-hidden="true">
        <div class="tab">
          <span class="tab-icon"></span>
          <span class="tab-text" id="tabText">Netflix</span>
          <span class="tab-close"></span>
        </div>
        <span class="tab-new"></span>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span class="pill"><span class="dot"></span><span id="statusLabel">Checking this tab</span></span>
          <span class="source" id="source"></span>
        </div>
        <p class="title" id="title"><span id="titleMain"></span><span class="title-suffix" id="titleSuffix"></span></p>
        <div class="skeleton" aria-hidden="true"><span></span><span></span></div>
        <div class="pane-foot">
          <p class="hint" id="hint"></p>
          <button class="btn" id="actionBtn" type="button" hidden></button>
        </div>
      </div>
    </section>

    <section class="settings" id="settings" aria-label="Settings">
      <label class="row row-main" for="enabled">
        <span class="row-title">Rename Netflix tabs</span>
        <input type="checkbox" class="switch" id="enabled" role="switch" />
      </label>
      <div class="format">
        <div class="format-head">
          <span class="eyebrow">Title format</span>
          <span class="example" id="example"></span>
        </div>
        <label class="row" for="showEpisode">
          <span class="row-title">Season, episode and episode name</span>
          <input type="checkbox" class="switch" id="showEpisode" role="switch" />
        </label>
        <label class="row" for="appendSuffix">
          <span class="row-title">“- Netflix” at the end</span>
          <input type="checkbox" class="switch" id="appendSuffix" role="switch" />
        </label>
      </div>
    </section>

    <footer class="foot">
      <span>Only runs on netflix.com. No tracking.</span>
      <nav>
        <a id="reportLink" href="https://github.com/doguyilmaz/titleflix/issues/new" target="_blank" rel="noopener noreferrer">Report a problem</a>
      </nav>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>

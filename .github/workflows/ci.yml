name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests (extension in Chromium against a simulated Netflix)
        run: bun run test:e2e

      - name: Package
        run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: titleflix-extension
          path: titleflix-v*.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
